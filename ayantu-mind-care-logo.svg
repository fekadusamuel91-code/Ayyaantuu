<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ayantu Mind Care logo</title>
  <desc id="desc">A calm teal and gold mental health logo with a heart, leaf, and mind pathway symbol beside the words Ayantu Mind Care.</desc>
  <defs>
    <linearGradient id="teal" x1="80" y1="54" x2="337" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D7C72"/>
      <stop offset="1" stop-color="#134E4A"/>
    </linearGradient>
    <linearGradient id="gold" x1="152" y1="98" x2="264" y2="287" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1C27D"/>
      <stop offset="1" stop-color="#D99542"/>
    </linearGradient>
    <filter id="shadow" x="38" y="28" width="344" height="344" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0D3D38" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="42" fill="#F7FBFA"/>

  <!-- Emblem -->
  <g filter="url(#shadow)">
    <circle cx="210" cy="210" r="142" fill="white"/>
    <circle cx="210" cy="210" r="124" fill="url(#teal)"/>
  </g>

  <!-- Inner calm leaf/mind symbol -->
  <path d="M210 101C171 101 140 132 140 171C140 195 152 216 170 229L210 276L250 229C268 216 280 195 280 171C280 132 249 101 210 101Z" fill="white" fill-opacity="0.94"/>
  <path d="M210 123C183 123 162 144 162 171C162 188 170 203 183 212L210 244L237 212C250 203 258 188 258 171C258 144 237 123 210 123Z" fill="#E8F7F5"/>
  <path d="M168 202C187 184 209 176 236 179" stroke="#0D7C72" stroke-width="13" stroke-linecap="round"/>
  <path d="M181 166C194 147 217 139 239 149" stroke="#0D7C72" stroke-width="13" stroke-linecap="round"/>
  <path d="M211 278C211 235 227 201 260 176" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>
  <path d="M260 176C244 174 230 178 219 188C232 190 247 186 260 176Z" fill="url(#gold)"/>
  <path d="M201 279C184 252 159 241 130 247C145 265 170 279 201 279Z" fill="#66B7AC"/>

  <!-- Text -->
  <g>
    <text x="410" y="186" font-family="Inter, Avenir, Segoe UI, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-2.2" fill="#143D3A">Ayantu</text>
    <text x="410" y="264" font-family="Inter, Avenir, Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.4" fill="#0D7C72">Mind Care</text>
    <rect x="410" y="292" width="430" height="6" rx="3" fill="#D99542" opacity="0.9"/>
    <text x="410" y="336" font-family="Inter, Avenir, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="1.8" fill="#657776">PSYCHIATRY • PSYCHOTHERAPY • WELLBEING</text>
  </g>
</svg>
